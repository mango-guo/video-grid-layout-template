<title>Frame Layout Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;600;700&display=swap">
<style>
/* Layout: a QC spec sheet. The frame sits on top like a monitor; the principle readouts sit beneath it like an inspection report. */
:root{
  --bg:#eef0ee; --panel:#ffffff; --fg:#17191b; --muted:#5d6468; --line:#d5dad8;
  --accent:#d6274a;        /* redline */
  --dim:#0f8fb8;           /* dimension cyan */
  --ok:#1f8a55; --warn:#b86e00;
  --sans:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans SC",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --panel:#1a1d20; --fg:#e8eaeb; --muted:#99a1a6; --line:#2b3034;
  --accent:#ff4d6d; --dim:#3fc7f2; --ok:#4fd18b; --warn:#f2a93b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --panel:#1a1d20; --fg:#e8eaeb; --muted:#99a1a6; --line:#2b3034;
  --accent:#ff4d6d; --dim:#3fc7f2; --ok:#4fd18b; --warn:#f2a93b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font:600 22px/1.2 var(--sans);letter-spacing:-.01em}
h1 span{font:500 12px var(--mono);color:var(--accent);letter-spacing:.08em;display:block;margin-bottom:6px;text-transform:uppercase}
.sub{margin:4px 0 0;color:var(--muted);max-width:62ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--fg);font:500 13px var(--sans);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--sans);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.seg button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
.chk{display:inline-flex;gap:6px;align-items:center;font:500 13px var(--sans);color:var(--muted);cursor:pointer}
.stagebox{position:relative;border-radius:6px;overflow:hidden;background:#000;max-width:100%}
#cv{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}
#cv:focus-visible{outline:3px solid var(--dim);outline-offset:-3px}
.manualbar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:10px}
.manualbar .hint{margin:0;color:var(--muted);font-size:13.5px}
.manualbar .hint b{color:var(--fg);font-weight:600;margin-right:6px}
.ctl{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted)}
.seg .val{display:inline-grid;place-items:center;min-width:56px;padding:0 8px;font:500 13px var(--mono);color:var(--fg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.toast{margin:0;min-height:1.4em;font:500 13px var(--sans);color:var(--warn)}
.drop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(214,39,74,.18);border:3px dashed var(--accent);color:#fff;font:600 18px var(--sans);opacity:0;pointer-events:none;transition:opacity .15s}
.stagebox.over .drop{opacity:1}
.status{font:500 12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.status b{color:var(--fg);font-weight:600}
.variants{display:flex;flex-wrap:wrap;gap:8px}
.variants button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font:500 13px var(--sans)}
.variants button small{display:block;font:400 11px var(--mono);color:var(--muted)}
.variants button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0;display:grid;gap:6px;align-content:start}
.card h3{margin:0;display:flex;align-items:center;gap:8px;font:600 14px/1.3 var(--sans)}
.card h3 i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border-radius:50%;background:var(--accent);color:#fff;font:600 12px var(--mono)}
.pill{margin-left:auto;font:600 11px var(--mono);padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.card .m{font:500 12.5px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font:600 14px var(--sans)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:12px}
.fields label{display:grid;gap:4px;font:500 12px var(--mono);color:var(--muted)}
.fields input{font:15px var(--sans);padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
#outbox img{display:block;width:100%;height:auto;border-radius:6px;margin-top:10px}
.foot{color:var(--muted);font-size:13px;max-width:80ch}
h2{margin:6px 0 0;font:600 15px var(--sans)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1><span id="t-kicker">1920 × 1080 · 12-col grid</span><b id="t-title">Frame Layout Finder</b></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-zh" aria-pressed="false">中文</button><button id="lang-en" aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="tools">
    <label class="btn primary" for="file" id="t-load">Load photo</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button class="btn" id="shuffle"></button>
    <button class="btn" id="sample"></button>
    <span class="seg" role="group" aria-label="Layers">
      <button data-layer="text" aria-pressed="true"></button><button data-layer="grid" aria-pressed="true"></button><button data-layer="zones" aria-pressed="true"></button><button data-layer="notes" aria-pressed="true"></button><button data-layer="heat" aria-pressed="false"></button>
    </span>
    <label class="chk"><input type="checkbox" id="opt-label" checked><span id="t-optlabel"></span></label>
    <label class="chk"><input type="checkbox" id="opt-subs" checked><span id="t-optsubs"></span></label>
  </div>

  <div class="stagebox" id="stagebox">
    <canvas id="cv" width="1920" height="1080" tabindex="0" aria-label="Layout canvas"></canvas>
    <div class="drop" id="t-drop"></div>
  </div>
  <div class="status" id="status"></div>

  <div class="variants" id="variants"></div>

  <div class="manualbar" role="group" aria-labelledby="t-manual">
    <p class="hint"><b id="t-manual"></b> <span id="t-hint"></span></p>
    <div class="tools">
      <span class="ctl"><span id="t-align"></span><span class="seg"><button data-al="auto"></button><button data-al="left"></button><button data-al="center"></button><button data-al="right"></button></span></span>
      <span class="ctl"><span id="t-span"></span><span class="seg"><button id="span-dec" aria-label="−">−</button><span class="val" id="spanv"></span><button id="span-inc" aria-label="+">+</button></span></span>
      <span class="ctl"><span id="t-size"></span><span class="seg"><button data-si="0">72</button><button data-si="1">84</button><button data-si="2">96</button></span></span>
      <label class="chk"><input type="checkbox" id="opt-strict" checked><span id="t-strict"></span></label>
      <button class="btn" id="reset"></button>
    </div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </div>

  <h2 id="t-report"></h2>
  <div class="report" id="report"></div>

  <details id="copybox">
    <summary id="t-edit"></summary>
    <div class="fields">
      <label><span data-f="eyebrow"></span><input id="f-eyebrow"></label>
      <label><span data-f="h"></span><input id="f-h"></label>
      <label><span data-f="body"></span><input id="f-body"></label>
      <label><span data-f="k"></span><input id="f-k"></label>
      <label><span data-f="s"></span><input id="f-s"></label>
      <label><span data-f="zh"></span><input id="f-zh"></label>
      <label><span data-f="en"></span><input id="f-en"></label>
      <label><span data-f="brand"></span><input id="f-brand"></label>
    </div>
  </details>

  <div class="tools">
    <button class="btn" id="export"></button>
    <button class="btn" id="copyspec"></button>
    <span class="status" id="copymsg"></span>
  </div>
  <div id="outbox" hidden><p class="foot" id="t-save"></p><img id="out" alt="Exported layout"></div>

  <p class="foot" id="t-foot"></p>
</div>

function report(){

async function full(){await fonts();solve();
  if(S.manual){const m=S.manual;const p=placeOnGrid(m.span,m.si,m.al,m.x,m.y);if(p)applyManual(p);else S.manual=null;}
  redraw();}
function redraw(){render();report();$("outbox").hidden=true;}

  $("t-kicker").textContent=t.kicker;$("t-title").textContent=t.title;$("t-sub").textContent=t.sub;$("t-load").textContent=t.load;

  $("t-drop").textContent=t.drop;$("t-report").textContent=t.report;$("t-edit").textContent=t.edit;$("export").textContent=t.export;$("copyspec").textContent=t.copyspec;
  $("t-save").textContent=t.save;$("t-foot").textContent=t.foot;
  $("t-manual").textContent=t.manual;$("t-hint").textContent=t.hint;$("t-align").textContent=t.align;$("t-span").textContent=t.span;$("t-size").textContent=t.size;

function setCopy(i){S.copyIdx=i;S.copy={...COPY[lang][i]};fillFields();}
function fillFields(){for(const k of Object.keys(S.copy))if($("f-"+k))$("f-"+k).value=S.copy[k];}
function setLang(l){lang=l;try{localStorage.setItem("flf-lang",l);}catch(e){}applyLang();setCopy(S.copyIdx);if(S.A)full();}
function loadFrame(src,name){
  const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;
  const c=mk(W,H),x=c.getContext("2d");const s=Math.max(W/w,H/h);x.drawImage(src,(W-w*s)/2,(H-h*s)/2,w*s,h*s);

}

/* ---- manual placement: drag, keys, controls ---- */
let drag=null;
const toCanvas=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
const hit=(px,py)=>{const L=cur();if(!L||!S.layers.text)return false;const r=pad(L.main.rect,24);return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;};
const autoAl=(x,w,span)=>{const cx=x+w/2;return Math.abs(cx-W/2)<80&&(13-span)%2===0?"center":cx<W/2?"left":"right";};
cv.addEventListener("pointerdown",e=>{const[px,py]=toCanvas(e);if(!hit(px,py))return;e.preventDefault();cv.focus({preventScroll:true});
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=cur().main;startManualFrom();drag={px,py,x:p.rect.x,y:p.rect.y,w:p.rect.w};cv.style.cursor="grabbing";toast("");scheduleRender();});
cv.addEventListener("pointermove",e=>{const[px,py]=toCanvas(e);if(!drag){cv.style.cursor=hit(px,py)?"grab":"default";return;}
  const m=S.manual,x=drag.x+px-drag.px,y=drag.y+py-drag.py;
  const al=S.alMode==="auto"?autoAl(x,drag.w,m.span):S.alMode;
  const p=placeOnGrid(m.span,m.si,al,x,y);if(p){applyManual(p);scheduleRender();}});
const endDrag=()=>{if(!drag)return;drag=null;cv.style.cursor="grab";commit(cur().main);};
cv.addEventListener("pointerup",endDrag);cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("keydown",e=>{const k=e.key;if(!k.startsWith("Arrow"))return;e.preventDefault();
  const p0=cur().main;startManualFrom();const n=e.shiftKey?4:1;
  const dx=k==="ArrowLeft"?-(COL+GUT)*n:k==="ArrowRight"?(COL+GUT)*n:0,dy=k==="ArrowUp"?-U*n:k==="ArrowDown"?U*n:0;
  let al=S.alMode==="auto"?(dx?autoAl(p0.rect.x+dx,p0.rect.w,p0.span):p0.al):S.alMode;if(al==="center"&&dx)al=dx<0?"left":"right";
  const p=placeOnGrid(p0.span,p0.si,al,p0.rect.x+dx,p0.rect.y+dy);
  if(p&&p.rect.x===p0.rect.x&&p.rect.y===p0.rect.y&&p.al===p0.al){toast(T[lang].edge);return;}
  commit(p,[Math.sign(dx),Math.sign(dy)]);});
function reshape(span,si,al){
  const p0=cur().main;startManualFrom();span=Math.max(3,Math.min(8,span));
  if(al==="center"&&(13-span)%2)span=span<8?span+1:span-1;
  const a=al==="auto"?autoAl(p0.rect.x,p0.rect.w,span):al;
  const p=placeOnGrid(span,si,a,a==="right"?p0.rect.x+p0.rect.w-(measureBlock(S.copy,SIZES[si],spanW(span))||{w:0}).w:p0.rect.x,p0.rect.y);
  if(!p){toast(T[lang].nofitText);return;}
  commit(p);
}
function updateManualUI(){
  const p=cur()&&cur().main;if(!p)return;
  $("spanv").textContent=`${p.span} ${lang==="zh"?"栏":"col"}`;
  document.querySelectorAll("[data-si]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.si===p.si));
  document.querySelectorAll("[data-al]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.al===S.alMode));
  $("reset").disabled=!S.manual;
}
document.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>{S.alMode=b.dataset.al;const p=cur().main;reshape(p.span,p.si,S.alMode);});
document.querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>{const p=cur().main;reshape(p.span,+b.dataset.si,S.alMode==="auto"?p.al:S.alMode);});
$("span-dec").onclick=()=>{const p=cur().main;reshape(p.span-1,p.si,S.alMode==="auto"?(p.al==="center"?"left":p.al):S.alMode);};
$("span-inc").onclick=()=>{const p=cur().main;reshape(p.span+1,p.si,S.alMode==="auto"?(p.al==="center"?"left":p.al):S.alMode);};
$("opt-strict").onchange=e=>{S.strict=e.target.checked;if(S.strict&&S.manual)commit(cur().main);};
$("reset").onclick=()=>{S.manual=null;S.alMode="auto";toast("");redraw();};
$("copyspec").onclick=()=>{
  const L=cur(),p=L.main;
  const spec={canvas:[W,H],grid:{columns:12,margin:[M,MT],column:COL,gutter:GUT,unit:U},
    headline:{align:p.al,columns:[p.c,p.c+p.span-1],x:Math.round(p.rect.x),y:p.rect.y,w:p.rect.w,h:p.rect.h,eyebrow:24,size:p.sz.h,lineHeight:p.sz.lh,body:p.sz.b,bodyLine:p.sz.blh,textColor:p.ct.color,contrast:+p.ct.ratio.toFixed(2),scrim:+p.ct.scrim.toFixed(2)},

};

applyLang();setCopy(Math.floor(Math.random()*COPY[lang].length));
